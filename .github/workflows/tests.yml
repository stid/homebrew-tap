# Checks the recipes and installs both on a Mac that has never had stidcart on it.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-latest
    steps:
      # Sets up Homebrew and links this checkout in as the tap stid/tap.
      - uses: Homebrew/actions/setup-homebrew@main

      - name: Style and audit
        run: |
          brew style stid/tap
          brew audit --tap stid/tap --strict --online

      # The setup action trusts the whole tap. Someone installing for the first time has not, so
      # the installs start from there and name each recipe in full, as the README does.
      - name: Start untrusted
        run: brew untrust --tap stid/tap

      # The cask asks for the formula, so this one install has to bring the command too.
      - name: The app, and the command with it
        run: |
          brew install --cask stid/tap/stidcart-app
          spctl -a -vv /Applications/stidcart.app
          stidcart --version
          brew test stid/tap/stidcart
